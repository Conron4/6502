FEATURES {
    STARTADDRESS: default = $C800;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}

MEMORY {
    ZP:      file = "", start = $0000, size = $0100, type = rw, define = yes;
    STACK:   file = "", start = $0100, size = $0100, type = rw, define = yes;

    RAM:     file = "", start = $0200, size = $9E00, type = rw, define = yes;

    IO:      file = "", start = $A000, size = $1000, type = rw;
    VRAM:    file = "", start = $B000, size = $1000, type = rw;

    CHARROM: file = "", start = $C000, size = $0800, type = ro;
    ROM:     file = "%O", start = $C800, size = $3800, type = ro, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    STARTUP:  load = ROM,     type = ro,  optional = yes;
    LOWCODE:  load = ROM,     type = ro,  optional = yes;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    DATA:     load = ROM,     type = rw,  optional = yes;
    BSS:      load = RAM,     type = bss, define = yes;
    HEAP:     load = RAM,     type = bss, optional = yes;
}